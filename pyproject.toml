[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomix"
dynamic = ["version"]
description = "Read-only VASP workflow inspection and experimental atomistic modeling tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "atomix developers"}
]
keywords = [
    "computational chemistry",
    "DFT",
    "VASP",
    "materials science",
    "atomistic simulation",
    "machine learning potentials",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core install is intentionally minimal (click only) so that `atomix --help`,
# `atomix info`, and `atomix --version` work without the scientific stack.
# Real functionality requires the `science` extra (or `all`).
dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
science = [
    "ase>=3.22.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pymatgen>=2023.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]
# MACE is the currently packaged MLIP backend. The NequIP wrapper remains
# experimental until it is migrated to NequIP's post-0.7 API.
mlip = [
    "mace-torch>=0.3.0",
    "torch>=2.0.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
# Full environment, including the scientific stack needed to run the test suite.
all = [
    "atomix[science,mlip,llm,dev]",
]

[project.scripts]
atomix = "atomix.cli.main:cli"

[project.urls]
Homepage = "https://github.com/vpasumarthi/atomix"
Documentation = "https://github.com/vpasumarthi/atomix#readme"
Repository = "https://github.com/vpasumarthi/atomix"

[tool.setuptools.packages.find]
where = ["."]
include = ["atomix", "atomix.*"]

[tool.setuptools.package-data]
"atomix.ai" = ["docs/*.md"]

[tool.setuptools.dynamic]
version = {attr = "atomix.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["atomix-pypi-release"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files use lazy __getattr__ re-exports: the public names
# are listed in a dynamically built __all__ and mirrored in a TYPE_CHECKING
# block for editors/type-checkers, so ruff cannot see they are re-exports.
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-config --strict-markers --tb=short"

[tool.coverage.run]
branch = true
source = ["atomix"]

[tool.coverage.report]
show_missing = true
skip_covered = true
