name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[science,dev]"

      - name: Run tests with coverage
        run: pytest --cov=atomix --cov-report=term-missing

      - name: Run Ruff
        run: ruff check

  package:
    name: Build and inspect wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check wheel contents
        run: python scripts/check_release_artifact.py dist/*.whl

      - name: Test installed wheel
        run: |
          python -m venv /tmp/atomix-wheel-smoke
          wheel=$(find dist -name '*.whl' -print -quit)
          /tmp/atomix-wheel-smoke/bin/python -m pip install "${wheel}[science]"
          /tmp/atomix-wheel-smoke/bin/atomix --version
          /tmp/atomix-wheel-smoke/bin/atomix info
          /tmp/atomix-wheel-smoke/bin/atomix inspect-vasp --help
