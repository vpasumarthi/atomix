[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomix"
version = "0.1.1"
description = "Atomistic Modeling Interface for eXploration - Natural language driven toolkit for ab initio / DFT / atomistic modeling workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "atomix developers"}
]
keywords = [
    "computational chemistry",
    "DFT",
    "VASP",
    "materials science",
    "atomistic simulation",
    "machine learning potentials",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "click>=8.0.0",
]

[project.scripts]
atomix = "atomix.cli:main"

[project.urls]
Homepage = "https://github.com/vpasumarthi/atomix"
Repository = "https://github.com/vpasumarthi/atomix"

[tool.setuptools.packages.find]
where = ["."]
include = ["atomix*"]
